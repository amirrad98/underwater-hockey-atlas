us:"See source notes",version:"2024-10-04",date:"2024-10-04",checkedAt:"2026-10-02",note:"Memorial award description says Vincent Budac was an early Timberwhales member while a student; graduated 2009. Establishes existence by 2009, not exact foundation year. · web",rights:"No reuse permission established; link to original",jurisdiction:"See source",sourceRecords:[{catalog:"club",id:"unbc_history",title:"UNBC October 4, 2024 board package",url:"https://www.unbc.ca/sites/default/files/sections/governance/2024-10-04-board-public-session-meeting-package-minus-minutes-corrected.pdf",publisher_type:"university",access_method:"web",published_date:"2024-10-04",retrieved_at:"2026-10-02",evidence_note:"Memorial award description says Vincent Budac was an early Timberwhales member while a student; graduated 2009. Establishes existence by 2009, not exact foundation year."}]},{id:"club-ckpg-2023",title:"Contemporary report on 2023 team start",url:"https://ckpgtoday.ca/2023/11/21/hockey-takes-a-dive-with-the-unbc-timberwhales/",publisher:"local_press",topic:"Clubs",language:"en",audience:"Everyone",authority:"local_press",access:"Public source; platform restrictions may apply",status:"See source notes",version:"2023-11-21",date:"2023-11-21",checkedAt:"2026-10-02",note:"Stephen Rader proposed a team to biochemistry students; Naomi Cole and Ella Stratton organized it. Current revival interpretation supported by club roster restart wording. · web",rights:"No reuse permission established; link to original",jurisdiction:"See source",sourceRecords:[{catalog:"club",id:"ckpg_2023",title:"Contemporary report on 2023 team start",url:"https://ckpgtoday.ca/2023/11/21/hockey-takes-a-dive-with-the-unbc-timberwhales/",publisher_type:"local_press",access_method:"web",published_date:"2023-11-21",retrieved_at:"2026-10-02",evidence_note:"Stephen Rader proposed a team to biochemistry students; Naomi Cole and Ella Stratton organized it. Current revival interpretation supported by club roster restart wording."}]},{id:"club-nationals-2024-event",title:"2024 Canadian Nationals event record",url:"https://uwhportal.com/events/ca-2024-canada-underwater-hockey-nationals",publisher:"tournament_portal",topic:"Clubs",language:"en",audience:"Everyone",authority:"tournament_portal",access:"Public source; platform restrictions may apply",status:"See source notes",version:"",date:"2026-10-02",checkedAt:"2026-10-02",note:"Tournament dates May 18–19, 2024 at UBC Aquatic Centre; club participation separately supported by official club site. · web",rights:"No reuse permission established; link to original",jurisdiction:"See source",sourceRecords:[{catalog:"club",id:"nationals_2024_event",title:"2024 Canadian Nationals event record",url:"https://uwhportal.com/events/ca-2024-canada-underwater-hockey-nationals",publisher_type:"tournament_portal",access_method:"web",published_date:null,retrieved_at:"2026-10-02",evidence_note:"Tournament dates May 18–19, 2024 at UBC Aquatic Centre; club participation separately supported by official club site."}]}],eg=[{id:"first-session",title:"Your first session",category:"Getting started",summary:"Begin with a supervised club session and borrowed kit. The first goal is to feel comfortable following the puck and returning to the surface, not to stay down longer.",sections:[{heading:"Before the pool",body:"Ask the club what it lends, what swim confidence it expects, and how its beginner group is supervised. Explain equipment fit or accessibility needs early. Learn how to stop, get help, and leave the play."},{heading:"A simple learning loop",body:"Watch one short demonstration, try one task, surface freely, and talk with the coach. Start with controlling and sharing the puck. Add rules and decisions in manageable pieces."},{heading:"Signs of progress",body:"You can identify your team, follow the puck, use your equipment comfortably, make a controlled pass, and find another player after releasing it. These are more useful early milestones than distance or breath-hold scores."},{heading:"Editorial status",body:"Original editorial synthesis for educational use; technical review by a qualified UWH coach recommended before public release."}],sourceIds:["coaching-atlantis-beginners","coaching-quebec-instructors","coaching-tuha-beginners"],related:["equipment","puck-control","team-support"]},{id:"puck-control",title:"Control the puck while seeing the game",category:"Skills",summary:"Control gives you time to choose. Build a comfortable range of puck movement, then gradually move attention from the puck toward teammates and space.",sections:[{heading:"Practice priorities",body:"Begin with a movement you can repeat smoothly. Work in both directions and use an appropriate left- or right-handed stick. Add speed only after control is reliable."},{heading:"Useful families",body:"Push-pull, figure patterns, direction changes, and curls train different parts of the same problem: keeping the puck available while your body and view change."},{heading:"What a coach can observe",body:"Does the puck remain within usable reach? Can the player look up? Is the next movement controlled? Is the free hand staying clear of opponents? Observe quality before increasing pressure."},{heading:"Editorial status",body:"Original editorial synthesis for educational use; technical review by a qualified UWH coach recommended before public release."}],sourceIds:["coaching-atlantis-star","coaching-chicago-drills","coaching-italian-manual"],related:["passing","equipment","small-sided-games"]},{id:"passing",title:"Passing and receiving as one action",category:"Skills",summary:"A pass succeeds when a teammate can use it. Choose the route, receiver, and next support position together.",sections:[{heading:"Choose the useful pass",body:"A flat pass and a lifted flick solve different spatial problems. Begin with accuracy in a clear lane. More distance or height is not automatically better, and an unsafe trajectory is never the objective."},{heading:"Receiver and passer",body:"The receiver offers a visible target and prepares for the next action. The passer follows the release by moving into useful space. A completed pass should improve the team's options."},{heading:"Coaching questions",body:"Was the lane open? Was the receiver ready? Could a shorter or sideways pass have preserved possession? For flick mechanics, use a qualified coach and the linked demonstrations rather than copying a still picture."},{heading:"Editorial status",body:"Original editorial synthesis for educational use; technical review by a qualified UWH coach recommended before public release."}],sourceIds:["coaching-atlantis-flick","coaching-atlantis-support"],related:["team-support","read-the-strike","video-review"]},{id:"read-the-strike",title:"The strike is a decision point",category:"Tactics",summary:"Reaching the puck first creates an opportunity. What happens next depends on support, opponent shape, and available space.",sections:[{heading:"Look beyond the puck",body:"A supporting teammate may be beside or behind the first player. The first touch should connect with that support rather than blindly sending the puck forward."},{heading:"Two pictures to review",body:"Freeze video before the first touch to identify the support options. Then freeze after the first exchange to see which team has a playable next action."},{heading:"Rule boundary",body:"This is a tactical discussion. Starting positions, permitted entry, and restart procedure come from the applicable current rules, not an old coaching clip."},{heading:"Editorial status",body:"Original editorial synthesis for educational use; technical review by a qualified UWH coach recommended before public release."}],sourceIds:["coaching-atlantis-strike","coaching-tuha-training"],related:["passing","team-support","video-review"]},{id:"team-support",title:"Width, depth, and a playable next option",category:"Teamplay",summary:"Support means being reachable and useful. A teammate directly beside the puck may still be unavailable if the passing lane is crowded.",sections:[{heading:"The support picture",body:"Think of the puck carrier, a reachable teammate, and space for the next action. Change the shape as the puck moves. Spacing should create options without disconnecting the team."},{heading:"After releasing the puck",body:"Reposition rather than admiring the pass. The next useful position could be behind, beside, or ahead of play. The correct choice changes with possession and pressure."},{heading:"Availability is dynamic",body:"Players surface whenever needed. Teammates can read who is available and fill a useful role; tactical structure must never pressure someone to extend a breath hold."},{heading:"Editorial status",body:"Original editorial synthesis for educational use; technical review by a qualified UWH coach recommended before public release."}],sourceIds:["coaching-atlantis-support","coaching-ffessm-guide"],related:["formations","transition","small-sided-games"]},{id:"formations",title:"Formation shapes are shared reference points",category:"Tactics",summary:"Read underwater-hockey formation numbers from the attacking line toward the defensive line. The same shape can use different role names and play differently in different clubs.",sections:[{heading:"Choose a common language",body:"Agree which end is being attacked and what words the team uses for forward, wing, center, back, and stopper. A formation label alone does not explain responsibilities."},{heading:"Use shapes to ask questions",body:"Who offers the first pass? Who covers behind an engagement? Who protects the opposite side? What changes when possession turns over? Ask these questions for each shape."},{heading:"Avoid false certainty",body:"No diagram guarantees success. Actual positions change with the puck, wall, available players, and opposition. The examples below are original schematic layouts, not mandatory or optimal positions."},{heading:"Editorial status",body:"Original editorial synthesis for educational use; technical review by a qualified UWH coach recommended before public release."}],sourceIds:["coaching-cmas-regulations","coaching-sfuwh-formations","coaching-atlantis-132"],related:["team-support","transition","video-review"]},{id:"transition",title:"React together when possession changes",category:"Teamplay",summary:"A turnover changes which spaces are useful. The nearest player and the covering players have different jobs.",sections:[{heading:"Three observations",body:"Locate the puck, identify immediate pressure, and look for uncovered space. Avoid having every player pursue the same contest."},{heading:"Cover behind pressure",body:"When one player engages, another can remain available behind the play. On regaining possession, look for a controlled exit that teammates can support."},{heading:"Training question",body:"Pause a small-sided game at a turnover. Ask each player to name their next job and show one alternative. Replay the same starting picture with a different response."},{heading:"Editorial status",body:"Original editorial synthesis for educational use; technical review by a qualified UWH coach recommended before public release."}],sourceIds:["coaching-atlantis-132","coaching-sfuwh-formations","coaching-italian-manual"],related:["formations","small-sided-games","video-review"]},{id:"small-sided-games",title:"Use small games to connect technique and decisions",category:"Practice design",summary:"An isolated movement becomes useful when a player recognizes when to use it. Small-sided games connect that movement to a teammate, opponent, and purpose.",sections:[{heading:"Change one constraint",body:"A coach can change playing space, available teammates, the scoring target, or defender pressure. Change one variable at a time so players can understand what helped."},{heading:"Choose an observable",body:"Look for a behavior such as offering a passing option, receiving under control, or supporting after release. Avoid judging the entire exercise only by goals."},{heading:"Keep the task playable",body:"If the challenge overwhelms the skill, simplify it. If the task is easy, add one decision. Rest, surface access, and supervision are prerequisites, not rewards for success."},{heading:"Editorial status",body:"Original editorial synthesis for educational use; technical review by a qualified UWH coach recommended before public release."}],sourceIds:["coaching-atlantis-overloads","coaching-ffessm-guide"],related:["puck-control","passing","coaching-pathways"]},{id:"video-review",title:"Watch one question at a time",category:"Match analysis",summary:"A useful review starts with a question. For example: after we pass, do we still have a reachable support player?",sections:[{heading:"An original review workflow",body:"Choose a short sequence. Watch once at normal speed, then pause before the key decision. Record what was visible, the option taken, and the outcome. Look for another comparable sequence before drawing conclusions."},{heading:"A compact tagging sheet",body:"Timestamp; phase; possession; pool zone; number of visible support options; chosen action; outcome; one question for training. Mark unclear views as unknown rather than assigning blame."},{heading:"From footage to practice",body:"Pick one team behavior to test next session. Review both successful and unsuccessful examples. Camera angle and missing off-screen players can change the interpretation."},{heading:"Rights and consent",body:"Link public broadcasts at their original publisher. Use team footage only with appropriate permission, particularly where children are involved. Do not rehost or publish identifiable coaching clips by default."},{heading:"Editorial status",body:"Original editorial synthesis for educational use; technical review by a qualified UWH coach recommended before public release."}],sourceIds:["coaching-ffessm-theses","coaching-hydro-analysis","coaching-ffessm-video"],related:["read-the-strike","formations","small-sided-games"]},{id:"equipment",title:"Choose kit by fit, function, and the current rules",category:"Equipment",summary:"Borrow and compare before buying. A comfortable legal setup that works together is more useful than selecting each item from a brand ranking.",sections:[{heading:"Personal fit",body:"Check mask seal and field of view, snorkel and mouthguard compatibility, cap and ear protection, fin-pocket comfort, and a glove that lets you grip the stick securely."},{heading:"Playing preference",body:"Stick shape and handedness affect feel. Fin stiffness and length affect comfort and maneuvering; test with a coach rather than assuming harder or more expensive means better."},{heading:"Before a competition",body:"Check the actual tournament rules and equipment inspection. Product marketing and a club's old gear page do not establish legal compliance."},{heading:"Buying across borders",body:"Compare the full landed cost, available sizes, return policy, lead time, and replacement parts. Ask whether a club order can reduce shipping; never assume a directory's old shipping offer still applies."},{heading:"Editorial status",body:"Original editorial synthesis for educational use; technical review by a qualified UWH coach recommended before public release."}],sourceIds:["coaching-tuha-equipment","coaching-breier","coaching-canam","coaching-cmas-equipment"],related:["equipment-care","diy-boundaries","first-session"]},{id:"equipment-care",title:"Inspect, rinse, dry, and replace",category:"Equipment",summary:"A simple gear check prevents avoidable session interruptions. Follow the maker's care instructions for each material.",sections:[{heading:"Before play",body:"Inspect straps, mask lenses, cap ear guards, fin edges, glove padding, and stick surfaces. Remove damaged or sharp equipment from use and have a knowledgeable club member assess it."},{heading:"After play",body:"Rinse and dry gear as its manufacturer recommends. Keep personal and club-loan equipment identifiable. For shared mouth-contact equipment, follow the club's hygiene procedure."},{heading:"Keep a repair log",body:"For club equipment, record defects and who checked them. Separate serviceable items from those awaiting repair. Replacement decisions should prioritize safe function."},{heading:"Editorial status",body:"Original editorial synthesis for educational use; technical review by a qualified UWH coach recommended before public release."}],sourceIds:["coaching-moresport","coaching-trueblue","coaching-stirling-diy"],related:["equipment","diy-boundaries"]},{id:"diy-boundaries",title:"DIY belongs inside a safety and compliance check",category:"Equipment",summary:"Homemade gloves and sticks are part of the sport's history. A homemade item still needs to protect people, avoid damage, and satisfy current competition requirements.",sections:[{heading:"Reasonable scope",body:"Start with non-safety-critical organizational aids such as equipment labels, storage dividers, and dryland tactics boards. Discuss any playing-equipment project with an experienced club maker."},{heading:"Gloves and sticks",body:"Use appropriate materials, maker instructions, curing conditions, and a post-build inspection. Do not infer that a material is safe on skin simply because a historical tutorial used it."},{heading:"Leave high-risk systems to specialists",body:"This atlas does not provide lead-smelting, underwater electrical-buzzer, or load-bearing goal-construction instructions. Pool operators and qualified specialists should approve systems used in the pool."},{heading:"Editorial status",body:"Original editorial synthesis for educational use; technical review by a qualified UWH coach recommended before public release."}],sourceIds:["coaching-stirling-diy","coaching-italian-manual","coaching-cmas-equipment"],related:["equipment","equipment-care"]},{id:"coaching-pathways",title:"Coaching qualifications and learning are different layers",category:"Coaching",summary:"Technical knowledge is one part of coaching. Qualification systems also address safe delivery, welfare, planning, assessment, and responsibilities.",sections:[{heading:"Start with your federation",body:"Use the pathway that applies in your country and club. Confirm admission criteria, safeguarding checks, first-aid expectations, and how the practical assessment works."},{heading:"Learn from other countries",body:"Foreign manuals can offer useful perspectives on technique or pedagogy. They do not automatically authorize coaching locally or establish equivalent qualifications."},{heading:"Make the next session better",body:"Choose one learning objective, explain the task clearly, observe a behavior, and adapt. Invite player feedback and keep selection and playing-time decisions transparent."},{heading:"Editorial status",body:"Original editorial synthesis for educational use; technical review by a qualified UWH coach recommended before public release."}],sourceIds:["coaching-boa-coaching","coaching-ffessm-training","coaching-ffessm-ie","coaching-quebec-instructors","coaching-fpas-coaches","coaching-tssf-coaching","coaching-wa-junior-coaches"],related:["small-sided-games","video-review","library-navigation"]},{id:"library-navigation",title:"Read the source labels before using a resource",category:"Research literacy",summary:"A page being online today does not mean its contents are current. A free download is not necessarily free to republish.",sections:[{heading:"Four useful distinctions",body:"Official rule; federation education; club/coaching opinion; commercial material. Each can help, but they answer different questions."},{heading:"Check the document itself",body:"Read its edition and publication date. Search-engine crawl dates describe indexing, not authorship. Mark an older source as historical when rule or safety guidance may have changed."},{heading:"Respect the author's work",body:"Use short original summaries with direct links. Keep photographs, diagrams, paid manuals, and videos at their original publisher unless a clear license or permission allows reuse."},{heading:"Editorial status",body:"Original editorial synthesis for educational use; technical review by a qualified UWH coach recommended before public release."}],sourceIds:["coaching-wuha-manual","coaching-italian-manual","coaching-hydro-resources","coaching-legacy-suppliers"],related:["coaching-pathways","video-review","equipment"]},{id:"rules",title:"Which rules apply?",category:"Rules",summary:"Start with the event's governing authority and published rule edition. The CMAS index currently lists February 2025 rules, and the public v 13.0 PDF combines playing-area and play rules. Domestic rulebooks and event bulletins can add different requirements. Keep the edition and jurisdiction beside every explanation.",sections:[{heading:"Reference guide",body:"Start with the event's governing authority and published rule edition. The CMAS index currently lists February 2025 rules, and the public v 13.0 PDF combines playing-area and play rules. Domestic rulebooks and event bulletins can add different requirements. Keep the edition and jurisdiction beside every explanation."},{heading:"Explore this topic",body:"CMAS rules versus national rules • Tournament regulations and event bulletins • Official rule determinations • Edition history and amendment tracking • Translation currency"},{heading:"Evidence boundary",body:"Never let an old translated PDF appear to supersede the current applicable official text."}],sourceIds:["coaching-cmas-regulations","rules-cmas-rules-v13","rules-cmas-tournament-v1","rules-nz-ref-resources","rules-ffessm-rules","rules-nob-regulations"],related:["equipment","safety"]},{id:"referee-pathway",title:"Become and develop as a referee",category:"Rules",summary:"Refereeing combines rule knowledge, positioning, communication, practical experience and assessment. Begin with the national pathway, then use the CMAS standards to understand international expectations. Video lessons and quick references are study aids; they do not award a qualification.",sections:[{heading:"Reference guide",body:"Refereeing combines rule knowledge, positioning, communication, practical experience and assessment. Begin with the national pathway, then use the CMAS standards to understand international expectations. Video lessons and quick references are study aids; they do not award a qualification."},{heading:"Explore this topic",body:"National entry routes • CMAS levels and maintaining active status • Water, chief, timekeeping and scoring roles • Mentored practical assessment • Signals and positioning • International applications"}],sourceIds:["rules-cmas-ref-course","rules-cmas-ref-overview","rules-cmas-ref-standards","rules-wuha-l1-course","rules-ffessm-ref-training","rules-nob-ref-course","rules-sauwhf-refereeing","rules-usoa-training","rules-uwhreferees-hub"],related:["rules","equipment","safety"]},{id:"fouls-signals-and-interpretations",title:"Fouls, signals and game management",category:"Rules",summary:"Learn signals together with the actual decisions they communicate. Use current rules for sanctions and restarts, and identify the rule edition attached to every clip or diagram. Older lessons remain useful for observation practice but need an instructor's review before being used as current exam material.",sections:[{heading:"Reference guide",body:"Learn signals together with the actual decisions they communicate. Use current rules for sanctions and restarts, and identify the rule edition attached to every clip or diagram. Older lessons remain useful for observation practice but need an instructor's review before being used as current exam material."},{heading:"Explore this topic",body:"Advantage • Obstruction and illegal puck movement • Substitutions and starts • Dangerous play • Corner delay • Penalty selection • Protests and communication"},{heading:"Evidence boundary",body:"Books explaining fouls are commentary; they do not override official determinations."} nd play under competent supervision with a session-specific emergency plan. Never practise underwater breath holding alone or hyperventilate before an underwater effort. Breath-hold contests and ignoring the urge to breathe create avoidable danger. Safety education and hands-on rescue training belong beside skill development."},{heading:"Explore this topic",body:"Supervision and rescue roles • Emergency action plans • Blackout risk and warning limitations • Safe progressive skill sessions • Incident reporting • Medical screening • First-aid qualification"},{heading:"Evidence boundary",body:"Adjacent freediving material needs hockey context; do not import deep-dive procedures as hockey rules."}],sourceIds:["rules-ais-breathhold","rules-dan-freediving-risk","rules-ffessm-rifahs","rules-boa-welfare","rules-uha-faq-safety","rules-czech-safety-2026"],related:["rules","equipment"]},{id:"concussion-and-return-to-play",title:"Concussion and return to play",category:"Safety",summary:"Suspected concussion during an underwater sport warrants prompt removal from play and medical assessment. In-water injury also creates a drowning hazard, so clubs need trained responders and a rehearsed emergency plan. Use the current federation/event protocol and clinician-led return decisions rather than a generic countdown.",sections:[{heading:"Reference guide",body:"Suspected concussion during an underwater sport warrants prompt removal from play and medical assessment. In-water injury also creates a drowning hazard, so clubs need trained responders and a rehearsed emergency plan. Use the current federation/event protocol and clinician-led return decisions rather than a generic countdown."},{heading:"Explore this topic",body:"Recognition and immediate response • Pool rescue and escalation • Recording and notifying incidents • Medical assessment • Graduated return under applicable guidance • Additional youth safeguards"},{heading:"Evidence boundary",body:"Some linked national documents are older; version and jurisdiction must be displayed. CMAS policy body could not be retrieved in this pass."}],sourceIds:["rules-cmas-concussion","rules-sauwhf-concussion-2024","rules-aufq-concussion-2024","rules-nz-concussion-2019","rules-boa-welfare"],related:["rules","equipment","safety"]},{id:"fitness-and-evidence",title:"Fitness, injury prevention and reading research",category:"Safety",summary:"Conditioning should support movement quality, repeat-effort capacity and recovery without making maximum breath holds the goal. The evidence library separates research findings from tested training programmes. An injury survey can identify priorities, while an observed average submersion time does not establish an individual safe limit.",sections:[{heading:"Reference guide",body:"Conditioning should support movement quality, repeat-effort capacity and recovery without making maximum breath holds the goal. The evidence library separates research findings from tested training programmes. An injury survey can identify priorities, while an observed average submersion time does not establish an individual safe limit."},{heading:"Explore this topic",body:"Aerobic and repeat-effort conditioning • Technique and workload progression • Upper-limb injury considerations • Recovery and signs to stop • Research design and limitations • What evidence does not establish"},{heading:"Evidence boundary",body:"No validated comprehensive UWH-specific conditioning or injury-prevention programme was established in this pass."}],sourceIds:["rules-ais-breathhold","rules-uwh-injury-study-2024","rules-uwh-submersion-study-2023","rules-uwh-spums-2022"],related:["rules","equipment","safety"]},{id:"safeguarding-and-clean-sport",title:"Safeguarding, integrity and clean sport",category:"Safety",summary:"A complete club resource library includes the responsibilities around play: safeguarding, conduct, risk assessment, anti-doping education and medication checks. These obligations are jurisdiction- and competition-specific. Link current official documents and identify their effective dates instead of rewriting sensitive eligibility rules from memory.",sections:[{heading:"Reference guide",body:"A complete club resource library includes the responsibilities around play: safeguarding, conduct, risk assessment, anti-doping education and medication checks. These obligations are jurisdiction- and competition-specific. Link current official documents and identify their effective dates instead of rewriting sensitive eligibility rules from memory."},{heading:"Explore this topic",body:"Child and vulnerable-adult protection • Codes of conduct • Reporting routes • Club risk assessment • ADEL education • Prohibited-list effective dates • Therapeutic-use exemptions and supplement risk"}],sourceIds:["rules-boa-welfare","rules-nz-policies","rules-sauwhf-documentation","rules-uha-documents","rules-cmas-clean-sport","rules-cmas-clean-education","rules-cmas-antidoping-2026","rules-wada-list"],related:["rules","equipment","safety"]},{id:"timber-whales",title:"UNBC Timber Whales",category:"Clubs",summary:"The UNBC TimberWhales are an active underwater-hockey club in Prince George, British Columbia, recognized by NUGSS. For fall 2026, the club announces Sunday 5:45–6:45 pm and Wednesday 9–10 pm practices at Canfor Leisure Pool, with new and returning players welcome.",sections:[{heading:"Club profile",body:"Revived in fall 2023, the UNBC TimberWhales build on a UNBC underwater-hockey team documented by 2009. The club combines pool training, an annual three-on-three tournament, national competition and team socials. Its website records participation in the 2024 Canadian Nationals, and its May 2026 report celebrates a second Nationals appearance for the revived team. Fall 2026 practices take place at Canfor Leisure Pool, 670 Quebec Street, on Sundays from 5:45 to 6:45 pm and Wednesdays from 9 to 10 pm. Contact timberwhales@unbc.ca or the club’s Instagram for first-visit details. The website a y & the BOA",url:"https://www.gbuwh.co.uk/page/history-uwh-boa",publisher:"British Octopush Association",topic:"History",language:"English",audience:"Everyone",authority:"National organization",access:"Public",status:"Historical",date:"2020-03-16",note:"Historical recollections including Alan Blake and Cliff Underwood. Index checked 2 Oct 2026; distinguish firsthand recollection from a comprehensive international history."},{id:"boa-clubs",title:"Find a UK club",url:"https://www.gbuwh.co.uk/clubs",publisher:"British Octopush Association",topic:"World",language:"English",audience:"Everyone",authority:"National organization",access:"Public",status:"Checked",date:"2026-10-02",note:"Registered-club directory with regional navigation. Session times and eligibility should be confirmed before travelling."},{id:"nz-clubs",title:"New Zealand club directory",url:"https://www.underwaterhockeynz.com/play-uwh/uwh-clubs",publisher:"Underwater Hockey New Zealand",topic:"World",language:"English",audience:"Everyone",authority:"National organization",access:"Public",status:"Indexed",date:"2026-10-02",note:"Official club-finding entry point found in search. Individual club records and venues have not been checked here."},{id:"nz-events",title:"New Zealand competition pathways",url:"https://www.underwaterhockeynz.com/events-1/tournaments-2",publisher:"Underwater Hockey New Zealand",topic:"World",language:"English",audience:"Players & coaches",authority:"National organization",access:"Public",status:"Indexed",date:"2026-10-02",note:"National overview of school, club, regional and international pathways. Search-indexed; current individual event details need confirmation."},{id:"usoa",title:"US underwater hockey introduction",url:"https://www.underwater-society.org/uwh",publisher:"Underwater Society of America",topic:"Getting started",language:"English",audience:"Beginners",authority:"National organization",access:"Public",status:"Indexed",date:"2026-10-02",note:"Search-indexed sport introduction; direct page retrieval failed during this build. Do not imply all linked material has been checked."},{id:"canada",title:"Canadian Underwater Games Association",url:"https://www.cuga.org/",publisher:"CUGA",topic:"World",language:"English",audience:"Everyone",authority:"National organization",access:"Public",status:"Indexed",date:"2026-10-02",note:"Canadian organization entry point supplied in project research context. Direct retrieval failed; older Prince George schedule information is not used as current."},{id:"brisbane-equipment",title:"Personal equipment guide",url:"https://www.brisbaneuwh.com.au/blog/what-personal-equipment-do-you-need-to-play-underwater-hockey/",publisher:"Brisbane Barracudas",topic:"Equipment",language:"English",audience:"Beginners",authority:"Club guidance",access:"Public",status:"Indexed",date:"2026-10-02",note:"Search-indexed club guide covering mouth and ear protection. Equipment commentary is local guidance; check current event rules before buying."},{id:"timber-notes",title:"Timber Whales · supplied research notes",url:"#/wiki/timber-whales",publisher:"Project research handoff",topic:"Clubs",language:"English",audience:"Everyone",authority:"Supplied research",access:"Source pending",status:"Supplied",date:"2026-09-12",note:"User-supplied field-level findings report a 12 Sep 2026 Instagram fall schedule. Original post URL and 21-source catalog are pending Library import; not independently checked in this build."}],Nb=[{id:"start-here",title:"A whole game beneath the surface",category:"Getting started",summary:"A weighted puck, a short stick, and a team that moves in three dimensions.",sourceIds:["cmas-overview","usoa"],related:["first-session","equipment","rules"],sections:[{heading:"Follow the puck",body:"Underwater hockey is played along a swimming-pool floor. Players use short sticks to move a weighted puck toward the opposing goal, returning to the surface to breathe. The surface and the floor are both part of the experience: looking down helps you follow play while teammates continue the move below."},{heading:"Watch the team, too",body:"For a first viewing, choose one simple question: where can the player with the puck go next? Look for a teammate nearby and space beyond the immediate contest. This is an editorial viewing exercise, not a rule or a prescribed team system."},{heading:"Find your way through the atlas",body:"Begin with a supervised first session, learn the equipment, then use the rules reference to understand what is allowed. The skill and formation pages offer conceptual ways to discuss play with a coach. Every article connects back to its sources so you can distinguish official requirements from local teaching choices."}]},{id:"first-session",title:"Your first pool session",category:"Getting started",summary:"Arrive with questions. Leave knowing the kit, the signals and the people.",sourceIds:["australia-faq","boa-welfare"],related:["safety","equipment","timber-whales"],sections:[{heading:"Before you go",body:"Contact the club to ask whether the session welcomes beginners, what swimming confidence they expect and which equipment can be borrowed. Underwater Hockey Australia describes confident swimming and comfort in deep water as the starting point; being an elite swimmer is not required. Local arrangements still matter."},{heading:"A useful arrival checklist",body:"Ask the session leader to explain the playing area, stop signal, supervision arrangements and how to ask for help. Get the equipment fitted before joining play. Tell the leader that this is your first visit and ask for a suitable introduction. This checklist is an editorial prompt for a conversation with the club, not a substitute for its induction."},{heading:"One achievable goal",body:"Make the first visit about understanding the environment and handling the equipment comfortably. Ask for feedback on one skill at a time. Membership, safeguarding, age requirements and health declarations vary by organization; check the local process instead of assuming another country’s policy applies."}]},{id:"rules",title:"Read the game, then read the rules",category:"Rules",summary:"Keep the official rulebook, tournament conditions and local practice clearly separated.",sourceIds:["rules","cmas-overview"],related:["equipment","formations","safety"],sections:[{heading:"The version matters",body:"The BOA rules page lists Rules of Play V13 and was updated on 27 February 2025. The project’s supplied research identifies CMAS v13, February 2025, as the current listed edition. This prototype checked the index, not every clause in the PDF. Follow the versioned document and any applicable event bulletin when resolving a specific ruling."},{heading:"Three different kinds of guidance",body:"Rules of play describe the game. Tournament regulations govern how an event is organized. A club may adapt a training exercise for its participants or pool. A useful question is therefore “Which document applies to this session?” rather than treating every piece of coaching advice as an international requirement."},{heading:"Dimensions need their context",body:"Do not use an introductory webpage or this conceptual atlas to certify a playing area. The CMAS overview summarizes pool dimensions; the supplied research flags that summary as potentially misleading without the rulebook’s full context. Exact dimensions, depths, tolerances and equipment specifications require a clause-level check before publication here."}]},{id:"equipment",title:"A small kit with a specific purpose",category:"Equipment",summary:"Understand the mask, snorkel, fins, stick and protection before shopping.",sourceIds:["chicago-equipment","brisbane-equipment","rules"],related:["first-session","puck-control","safety"],sections:[{heading:"See, move, play",body:"A mask supports underwater vision; a snorkel is used at the surface; fins support movement. The short stick plays the puck. A protective glove covers the playing hand, while mouth protection and a cap with ear protection address vulnerable areas. Your club can help fit the kit and explain the applicable equipment rules."},{heading:"Try before committing",body:"Chicago Underwater Hockey offers beginners club equipment and recommends trying different pieces before buying. Its page describes local preferences, including sticks and fins. Treat these as experience from a club, not a universal shopping list or an endorsement by this atlas."},{heading:"A practical inspection",body:"Ask a coach to check fit, condition, sharp edges and suitability for the session. Avoid copying a modification merely because a player on a video uses it. When preparing for competition, compare your exact equipment against the applicable rulebook and organizer guidance."}]},{id:"puck-control",title:"Puck control: make the next touch easier",category:"Skills",summary:"Explore control, turns and changes of direction with a coach.",sourceIds:["chicago-drills"],related:["passing","equipment","formations"],sections:[{heading:"Build a vocabulary",body:"Chicago’s drill index includes standard and reverse curls, push-pull patterns, figure patterns and an introduction to the flick. These names offer a useful vocabulary for asking a coach what to demonstrate. Linked videos are a starting point for discussion; they have not all been reviewed by this atlas."},{heading:"A conceptual progression",body:"Editorial learning prompt: begin by asking how to keep the puck in a useful position, then how to change direction, then how to choose a teammate. Ask your coach to demonstrate slowly and explain what they are watching. The goal of this progression is understanding, not a timed underwater challenge."},{heading:"Notice the outcome",body:"After an attempt, ask whether the puck ended where you intended and whether your next action was available. A dramatic move is less useful if it leaves you without an option. Use the answer to choose the next thing to practise in the supervised session."}]},{id:"passing",title:"Passing: make a connection",category:"Skills",summary:"Think about the receiver, the route and what happens after the pass.",sourceIds:["chicago-drills"],related:["puck-control","formations","learning-path"],sections:[{heading:"A coaching conversation",body:"The questions here are original conceptual prompts, not official technique instructions. Where is your teammate? Is there an open route between you? What will they be able to do when the puck arrives? Discuss those questions at the surface before trying a coach-led activity."},{heading:"Start with a shared intention",body:"Ask the coach to distinguish a controlled transfer along the floor from a lifted flick. Chicago’s resource index includes a flick introduction, but the index alone cannot establish safe technique or the right exercise for your group. Let the coach choose spacing and progression."},{heading:"Keep watching after release",body:"A useful review question is whether the receiver had a playable next touch. When watching a match, pause mentally after each pass and notice whether the passing player creates another option. This observational exercise can help make teamwork visible without prescribing a single style."}]},{id:"formations",title:"Formations are a conversation about space",category:"Tactics",summary:"Read the 3–3 and 2–2–2 boards as conceptual arrangements, not fixed positions.",sourceIds:["rules"],related:["passing","puck-control","learning-path"],sections:[{heading:"What the diagrams mean",body:"The atlas diagrams are original schematic teaching aids. A 3–3 board groups six markers into two lines; a 2–2–2 board groups them into three. They are not a CMAS recommendation, a measured pool plan or a claim about how every team uses those names. Teams can define their roles differently."},{heading:"Ask about relationships",body:"Use a board to discuss who supports the puck, who covers space behind the move and where an outlet could appear. Move one marker and ask which other player’s responsibility changes. The value is in the discussion with teammates, not in memorizing six dots."},{heading:"A board cannot show everything",body:"A top-down drawing hides depth, surface recovery, substitutions and changing possession. Real play will not resemble a static diagram for long. Have a coach explain the local team’s language and review actual game situations before treating an arrangement as a system."}]},{id:"safety",title:"Good sessions begin with shared safety",category:"Safety",summary:"Supervision, clear stop signals, suitable equipment and a culture of speaking up.",sourceIds:["boa-welfare","australia-faq"],related:["first-session","equipment","rules"],sections:[{heading:"Keep learning supervised",body:"Use organized, appropriately supervised sessions and follow the pool and club’s safety procedures. This atlas does not provide breath-hold training: do not practise underwater breath-holding alone, hyperventilate before submerging, or turn a drill into a maximum-duration contest. Ask the session leader how supervision and emergency response work before joining in."},{heading:"Know the local process",body:"The BOA welfare page links safeguarding policies, codes of conduct, risk assessments and concussion guidance. These are UK organizational resources, not automatically the policy for a Canadian or Australian club. Ask your own organization where to report concerns and which participation requirements apply."},{heading:"Speak up early",body:"Stop and tell the session leader if equipment is unsuitable, you feel unwell or you are uncomfortable with an activity. A webpage cannot assess an individual’s fitness to participate. Discuss health questions with an appropriate health professional and the club’s designated contact before participation."}]},{id:"history",title:"From a winter pool game to a wider world",category:"History",summary:"Begin with the people who described the early game in their own words.",sourceIds:["boa-history","cmas"],related:["start-here","world-guide","timber-whales"],sections:[{heading:"Southsea, 1954",body:"The BOA history collection includes Alan Blake’s account of seeking a competitive pool activity as the 1954 summer diving season ended. It also collects Cliff Underwood’s recollection of the game spreading among diving clubs and the need for more consistent rules as clubs began playing one another."},{heading:"Names carry history",body:"The BOA still uses Octopush alongside underwater hockey. Follow its historical accounts for the language and experiences of the early British game. These recollections are an entry point, not a complete history of every country’s participation."},{heading:"An open research trail",body:"The next edition should add sourced national timelines, early clubs and competition milestones. Each dated event needs a traceable record. A club revival should be distinguished from its first founding, and an archived team listing should not be presented as evidence of current activity."}]},{id:"world-guide",title:"Find the community, then confirm the session",category:"World",summary:"National directories are useful doors into a sport built around local pools.",sourceIds:["boa-clubs","nz-clubs","nz-events","canada"],related:["first-session","timber-whales","history"],sections:[{heading:"Start with the organization",body:"The BOA maintains a registered-club directory, while Underwater Hockey New Zealand offers a club-finding entry point. National indexes can help identify a relevant club, but the club itself is usually the next place to confirm a beginner session, venue and contact route."},{heading:"Read the map honestly",body:"Map points preserve each catalog’s precision: some are city or suburb points, others are sourced venue points. National organizations and locations without verified coordinates remain unpinned. The list is a small editorial selection, not a census of the sport or a statement that unlisted countries have no underwater hockey."},{heading:"Before travelling",body:"Confirm dates, local time, pool address, eligibility and whether visitors are welcome. Old directories can outlive pool bookings. The Timber Whales profile demonstrates why dated club updates and historical listings need different labels."}]},{id:"learning-path",title:"A route from curious to connected",category:"Getting started",summary:"Four stages for exploring the wiki alongside real club coaching.",sourceIds:["australia-faq","chicago-drills","rules"],related:["first-session","puck-control","formations"],sections:[{heading:"01 · Get oriented",body:"Read the sport introduction and first-session page. Find a club, ask about a beginner visit and learn its safety arrangements. This route is an editorial reading sequence rather than a formal qualification."},{heading:"02 · Get comfortable",body:"Explore the equipment guide with the people who will help fit your kit. Ask the coach to choose one manageable skill. Use the puck-control vocabulary to describe what you are learning."},{heading:"03 · Find a teammate",body:"Read passing and the conceptual formation guide. Ask how your club describes support, space and roles. Match the words to a demonstration or a piece of game footage."},{heading:"04 · Build understanding",body:"Open the versioned rules gateway, watch a match and ask about a decision you did not understand. Return to the resource library as your questions become more specific. Progress is about understanding and participation, not a breath-hold target."}]},{id:"timber-whales",title:"UNBC Timber Whales",category:"Clubs",summary:"A Prince George club story: a revival, a pool community and a new chapter.",sourceIds:["timber-notes","canada"],related:["first-session","world-guide","history"],sections:[{heading:"Fall 2026 · supplied schedule",body:"The supplied research notes report a club Instagram update dated 12 September 2026: Canfor Leisure Pool, Sundays 17:45–18:45 and Wednesdays 21:00–22:00, in Prince George local time. These findings were supplied by the project owner; the original post has not been independently retrieved in this build. Confirm with the club before attending."},{heading:"A revival with earlier roots",body:"The supplied research records a revival in 2023 and an earlier team by 2009. These are separate milestones. Older CUGA listings naming Prince George Aquatic Centre and different times are historical and should not override the supplied fall 2026 update."},{heading:"What remains unconfirmed",body:"Leadership changed in 2025, but 2026 leadership is unconfirmed. A public roster has 20 undated entries; it is not a verified current membership or officer list and names are intentionally omitted here. No identities are inferred from photographs."},{heading:"The next useful update",body:"Recover the original 21-source club catalog, attach exact source URLs and verify current newcomer arrangements. Until then, this profile preserves the supplied distinctions and dates without representing its evidence as independently checked."}]}];function eu(l){const p=new URL(l,"https://atlas.local");p.protocol="https:",p.hostname=p.hostname.replace(/^www\./,""),p.hash="",p.pathname=p.pathname.replace(/\/$/,"")||"/",p.hostname==="cmas.org"&&["/hockey","/hockey.html"].includes(p.pathname)&&(p.pathname="/hockey"),p.hostname==="underwaterhockeynz.com"&&(p.pathname=p.pathname.toLowerCase());for(const m of[...p.searchParams.keys()])(m.startsWith("utm_")||["fbclid","img_index"].includes(m))&&p.searchParams.delete(m);return p.href}const ag=new Map($f.map(l=>[eu(l.url),l])),zb=new Map(tg.map(l=>{var p;return[l.id,((p=ag.get(eu(l.url)))==null?void 0:p.id)??l.id]})),Gt=[...$f,...tg.filter(l=>l.id!=="timber-notes"&&!ag.has(eu(l.url)))],Ub=new Set(eg.map(l=>l.id)),zi=[...Nb.filter(l=>!Ub.has(l.id)).map(l=>({...l,sourceIds:l.sourceIds.map(p=>zb.get(p)??p)})),...eg],Xl=Cb,Db=[{id:"asap-about",title:"ASAP Underwater Hockey: about and category navigation",url:"https://asapmotorsport.com/uwh-about-us",p
